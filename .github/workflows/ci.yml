name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # macos-latest builds with Apple Clang, ubuntu-latest with GCC.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The published equilibrium comes from the authors' server, which is
      # slow; keep it between runs, keyed on the Makefile that pins it.
      - uses: actions/cache@v4
        with:
          path: data/gsi
          key: gsi-${{ hashFiles('Makefile') }}
      - name: make test
        run: make test
